<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json">
  <title>Trigger — Accounting Timing Challenge</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#111827; --panel2:#172033; --text:#f8fafc;
      --muted:#aab4c5; --line:#2a3550; --accent:#7dd3fc; --good:#34d399;
      --bad:#fb7185; --gold:#fbbf24;
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#08101f,#101728);color:var(--text);}
    button{font:inherit}
    .wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
    .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
    .brand{font-weight:900;letter-spacing:.08em}.tag{color:var(--muted);font-size:.9rem}
    .scorebox{background:#0f172a;border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:right}
    .score{font-weight:800;font-size:1.2rem}.career{font-size:.78rem;color:var(--gold)}
    .card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
    .eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:.76rem;letter-spacing:.12em}
    h1,h2,h3{margin:.4rem 0 1rem} h1{font-size:clamp(2.3rem,7vw,4.8rem);line-height:.95}
    .hero p{color:var(--muted);font-size:1.1rem;max-width:680px}
    .primary,.secondary,.answer,.confidence{border:0;border-radius:14px;padding:14px 18px;cursor:pointer;transition:.15s ease}
    .primary{background:var(--text);color:#111827;font-weight:900}.primary:hover{transform:translateY(-1px)}
    .secondary{background:#1e293b;color:var(--text);border:1px solid var(--line)}
    .timeline{display:grid;gap:10px;margin:20px 0}
    .event{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0f172a}
    .date{font-weight:900;color:var(--gold)} .eventtext{color:#dbe4f0}
    .answers{display:grid;gap:10px;margin:18px 0}.answer{background:#172033;color:var(--text);text-align:left;border:1px solid var(--line)}
    .answer.selected{outline:2px solid var(--accent);background:#183047}.answer.correct{outline:2px solid var(--good)}.answer.wrong{outline:2px solid var(--bad)}
    .confidence-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.confidence{background:#101827;color:var(--muted);border:1px solid var(--line)}.confidence.selected{color:white;outline:2px solid var(--accent)}
    .feedback{margin-top:18px;padding:18px;border-radius:16px;background:#0f172a;border:1px solid var(--line)}
    .good{color:var(--good)} .bad{color:var(--bad)}
    .reward{margin-top:22px;padding:20px;border:1px solid #725f20;background:linear-gradient(135deg,#2a2412,#16170d);border-radius:18px}
    .reward .big{font-size:2rem;font-weight:900}.reward .qualifier{color:#fde68a;font-style:italic}
    .office{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}.item{background:#0f172a;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:.85rem}
    .progress{height:8px;background:#0f172a;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:var(--accent);width:0}
    .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:.78rem;margin-right:6px}
    .result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.stat{padding:16px;border-radius:16px;background:#0f172a;border:1px solid var(--line)}
    .stat strong{display:block;font-size:1.6rem}
    .footer{margin-top:18px;color:#748096;font-size:.8rem}
    @media(max-width:640px){.topbar{align-items:flex-start}.event{grid-template-columns:66px 1fr}.card{padding:18px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><div class="brand">TRIGGER</div><div class="tag">What happened — and when does accounting care?</div></div>
    <div class="scorebox"><div class="score" id="score">0 pts</div><div class="career" id="career">Staff</div></div>
  </div>
  <main id="app"></main>
</div>
<script>
const rewards = [
  {at:800, icon:"💻", name:"Brand New Laptop", q:"Excel included. IT has disabled macros."},
  {at:1600, icon:"🖱️", name:"Wireless Mouse", q:"Batteries not included. Expense reimbursement denied as immaterial."},
  {at:2600, icon:"🟩", name:"Green Eyeshade", q:"Your family is becoming concerned."},
  {at:3800, icon:"🧮", name:"Ten-Key With Paper Roll", q:"The paper roll has been charged to your cost center."},
  {at:5200, icon:"🍽️", name:"Lunch With the Controller", q:"He's sharing his leftovers."},
  {at:6800, icon:"🥗", name:"Free Lunch in the Boardroom", q:"With the Audit Committee. You're presenting."},
  {at:8500, icon:"⚾", name:"Two Tickets to a Twins Game", q:"You're going with the auditors. They've already sent an agenda."},
  {at:10300, icon:"🖥️", name:"Second Monitor", q:"Now you can have two spreadsheets open that don't reconcile."},
  {at:12300, icon:"🪑", name:"Executive Office Chair", q:"Previously owned by someone affected by the restructuring."},
  {at:14500, icon:"🧥", name:"Finance Quarter-Zip", q:"Men's XL only."},
  {at:17000, icon:"🅿️", name:"Reserved Parking", q:"During year-end close only. After 9:00 p.m."},
  {at:20000, icon:"🏆", name:"Golden Ten-Key", q:"You knew when to book it. You knew when not to book it. And you documented both."}
];
const careers = [
  [0,"Staff"],[2500,"Senior"],[5000,"Manager"],[8500,"Director"],[12000,"Controller"],[17000,"CAO"]
];
let qs=[], idx=0, score=0, correct=0, selected=null, confidence=1, answered=false, earned=[];
const app=document.getElementById("app");
const scoreEl=document.getElementById("score"), careerEl=document.getElementById("career");

function career(){
  let c="Staff"; for(const [p,n] of careers) if(score>=p)c=n; return c;
}
function updateHeader(){scoreEl.textContent=score.toLocaleString()+" pts";careerEl.textContent=career();}
function start(){
  idx=0;score=0;correct=0;selected=null;confidence=1;answered=false;earned=[];updateHeader();renderQ();
}
function home(){
  app.innerHTML=`<section class="card hero">
    <div class="eyebrow">Accounting Timing Challenge</div>
    <h1>PULL<br>THE TRIGGER.</h1>
    <p>Something happened. Decide when accounting needs to <b>assess</b>, <b>recognize</b>, or <b>realize</b> it. Correct judgment earns career points and increasingly questionable professional rewards.</p>
    <button class="primary" onclick="start()">Start the Close</button>
    <div class="office"><span class="item">🔎 Assess</span><span class="item">📚 Recognize</span><span class="item">💵 Realize</span><span class="item">⚠️ Don't book it too early</span></div>
    <div class="footer">Prototype V1 • 8 scenarios • Local-only scoring</div>
  </section>`;
}
function renderQ(){
  if(idx>=qs.length){results();return}
  const q=qs[idx]; selected=null; confidence=1; answered=false;
  const timeline=q.timeline.map(e=>`<div class="event"><div class="date">${e.date}</div><div class="eventtext">${e.event}</div></div>`).join("");
  const answers=q.answers.map((a,i)=>`<button class="answer" id="a${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join("");
  app.innerHTML=`<section class="card">
    <div class="eyebrow">Question ${idx+1} of ${qs.length}</div>
    <div class="progress"><div class="bar" style="width:${(idx/qs.length)*100}%"></div></div>
    <div><span class="pill">${q.category}</span><span class="pill">${q.difficulty}</span><span class="pill">${q.mode}</span></div>
    <h2>${q.title}</h2><p style="color:var(--muted)">${q.scenario}</p>
    <div class="timeline">${timeline}</div>
    <h3>${q.question}</h3>
    <div class="answers">${answers}</div>
    <div class="eyebrow">Confidence multiplier</div>
    <div class="confidence-row">
      <button id="c1" class="confidence selected" onclick="conf(1)">Low · 1×</button>
      <button id="c15" class="confidence" onclick="conf(1.5)">Medium · 1.5×</button>
      <button id="c2" class="confidence" onclick="conf(2)">High · 2×</button>
    </div>
    <button class="primary" id="submit" onclick="submitAnswer()">Pull the Trigger</button>
    <div id="feedback"></div>
  </section>`;
}
function pick(i){
  if(answered)return; selected=i;
  document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));
  document.getElementById("a"+i).classList.add("selected");
}
function conf(v){
  if(answered)return; confidence=v;
  document.querySelectorAll(".confidence").forEach(x=>x.classList.remove("selected"));
  document.getElementById(v===1?"c1":v===1.5?"c15":"c2").classList.add("selected");
}
function submitAnswer(){
  if(selected===null){alert("Choose the event you think triggers the accounting.");return}
  const q=qs[idx]; answered=true;
  const isCorrect=selected===q.correct;
  const base=1000, delta=isCorrect?Math.round(base*confidence):-Math.round(300*confidence);
  score=Math.max(0,score+delta); if(isCorrect)correct++;
  document.querySelectorAll(".answer").forEach((x,i)=>{x.disabled=true;if(i===q.correct)x.classList.add("correct");if(i===selected && !isCorrect)x.classList.add("wrong")});
  updateHeader();
  const newly = rewards.filter(r=>score>=r.at && !earned.includes(r.name));
  newly.forEach(r=>earned.push(r.name));
  let rewardHtml="";
  if(newly.length){
    const r=newly[newly.length-1];
    rewardHtml=`<div class="reward"><div class="eyebrow">Reward Unlocked</div><div class="big">${r.icon} ${r.name}</div><div class="qualifier">${r.q}</div></div>`;
  }
  document.getElementById("feedback").innerHTML=`<div class="feedback">
    <h3 class="${isCorrect?"good":"bad"}">${isCorrect?"✓ Correct":"✕ Missed trigger"} ${delta>=0?"+":""}${delta.toLocaleString()} pts</h3>
    <p>${q.explanation}</p>
    ${rewardHtml}
    <div style="margin-top:16px"><button class="primary" onclick="nextQ()">${idx===qs.length-1?"Finish the Close":"Next Issue →"}</button></div>
  </div>`;
  document.getElementById("submit").style.display="none";
}
function nextQ(){idx++;renderQ()}
function results(){
  const pct=Math.round(correct/qs.length*100);
  const rewardList=earned.length?earned.map(n=>`<span class="item">🏆 ${n}</span>`).join(""):`<span class="item">📎 Participation paperclip</span>`;
  app.innerHTML=`<section class="card">
    <div class="eyebrow">Close Complete</div>
    <h1>${pct}%</h1>
    <div class="result-grid">
      <div class="stat"><span>Correct</span><strong>${correct}/${qs.length}</strong></div>
      <div class="stat"><span>Score</span><strong>${score.toLocaleString()}</strong></div>
      <div class="stat"><span>Career level</span><strong>${career()}</strong></div>
    </div>
    <h3>${pct>=80?"PASS — the books may close.":"REVIEW REQUIRED — National Office has additional questions."}</h3>
    <p style="color:var(--muted)">${pct>=80?"The auditors have only three follow-up questions. Miraculous.":"Please prepare a memo explaining why your answers were reasonable at the time."}</p>
    <div class="eyebrow">Trophy cabinet</div><div class="office">${rewardList}</div>
    <div style="margin-top:24px"><button class="primary" onclick="start()">Run Another Close</button> <button class="secondary" onclick="home()">Home</button></div>
  </section>`;
}
fetch("questions.json").then(r=>r.json()).then(data=>{qs=data;home()}).catch(()=>{app.innerHTML="<p>Could not load question bank.</p>"});
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script>
</body>
</html>
